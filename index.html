    // Components

    // Toast Component
    function Toast({ toast, onClose }) {
      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => onClose(), 3800);
        return () => clearTimeout(timer);
      }, [toast, onClose]);

      if (!toast) return null;

      const isSuccess = toast.type === 'success';
      const isError = toast.type === 'error';

      return (
        <div className="fixed bottom-5 right-5 z-50 max-w-md w-[calc(100vw-2.5rem)] animate-slide-up">
          <div className={`flex items-start gap-3 p-4 rounded-2xl shadow-2xl border ${isSuccess ? 'bg-purple-950 border-purple-700/60 text-white' : isError ? 'bg-red-950 border-red-700/60 text-white' : 'bg-slate-900 border-slate-700 text-white'}`}>
            <div className="mt-0.5 p-1 rounded-full bg-white/10 text-purple-300">
              {isSuccess ? (
                <svg className="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            </button>

                  <svg className="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                const isSelected = selectedDepartment === dept.code;

                return (
                  <button

                      isSelected ? style.ring : 'hover:border-purple-300'

                        <span className="text-xs text-slate-600 font-medium">({yr.name})</span>

                        <span className="text-[11px] text-slate-500">students</span>

            <div className="flex items-start justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-tr from-purple-700 to-indigo-600 text-white font-black text-sm flex items-center justify-center shadow-md shadow-purple-200 shrink-0">
                  {initials}

                <div className="min-w-0">
                  <h4 className="text-sm sm:text-base font-bold text-slate-800 tracking-tight truncate">

                      {student.id}

                  </div>

              </div>

              <div className="flex flex-col items-end gap-1 shrink-0">
                <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold border ${deptStyles[student.department]?.badge || 'bg-slate-100 text-slate-700'}`}>
                  {student.department}
                </span>
                <span className={`px-2 py-0.5 rounded-full text-[11px] font-semibold border ${yearStyles[student.academicYear] || 'bg-slate-100 text-slate-700'}`}>
                  {student.academicYear}

              </div>

            {/* Email link */}
            <div className="mt-3 pt-3 border-t border-slate-100 flex items-center gap-2 text-xs text-slate-600 truncate">

                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
              <a
                href={`mailto:${student.email}`}
                className="hover:text-purple-700 truncate underline-offset-2 hover:underline"
                title={student.email}
              >
                {student.email}
              </a>
            </div>
          </div>

          {/* Action buttons with minimum 44px touch targets */}
          <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100">
            <button
              onClick={() => onEdit(student)}
              className="w-full min-h-[44px] px-3 py-2 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-800 text-xs font-bold border border-purple-200 transition-colors flex items-center justify-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-purple-400 active:bg-purple-200"
              aria-label={`Edit ${student.name}`}
            >
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
              </svg>
              <span>Edit</span>
            </button>

            <button
              onClick={() => onDelete(student)}
              className="w-full min-h-[44px] px-3 py-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-700 text-xs font-bold border border-red-200 transition-colors flex items-center justify-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-red-400 active:bg-red-200"
              aria-label={`Delete ${student.name}`}
            >
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              <span>Delete</span>
            </button>
          </div>
        </div>
      );
    }

    // Empty State Component
    function EmptyState({ searchQuery, selectedDepartment, selectedYear, onResetFilters, onOpenAddModal, totalStudents }) {
      const isFiltered = Boolean(searchQuery || selectedDepartment || selectedYear);

      return (
        <div className="bg-white rounded-2xl border border-purple-100 p-8 sm:p-12 text-center shadow-sm my-4">
          <div className="w-16 h-16 sm:w-20 sm:h-20 mx-auto rounded-3xl bg-purple-50 border border-purple-100 flex items-center justify-center text-purple-600 mb-4 shadow-inner">
            {totalStudents === 0 ? (
              <svg className="w-8 h-8 sm:w-10 sm:h-10 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.75" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
              </svg>
            ) : (
              <svg className="w-8 h-8 sm:w-10 sm:h-10 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.75" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            )}
          </div>

          <h3 className="text-lg sm:text-xl font-bold text-slate-800 tracking-tight">
            {totalStudents === 0 ? 'No Students in System' : 'No Matching Students Found'}
          </h3>

          <p className="text-sm text-slate-500 max-w-md mx-auto mt-2 leading-relaxed">
            {totalStudents === 0
              ? 'There are currently zero students in the CampusConnect system. You can add a new student or restore default sample records.'
              : isFiltered
              ? `No students found matching your criteria. Try adjusting your search query "${searchQuery || ''}" or clearing filters.`
              : 'No student records available.'}
          </p>

          <div className="mt-6 flex flex-wrap items-center justify-center gap-3">
            {isFiltered && (
              <button
                onClick={onResetFilters}
                className="px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white text-xs sm:text-sm font-bold shadow-md shadow-purple-200 transition-all flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-purple-400 min-h-[44px]"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>Clear Search & Filters</span>
              </button>

            <button
              onClick={onOpenAddModal}
              className="px-4 py-2.5 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 text-xs sm:text-sm font-bold transition-all flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-purple-400 min-h-[44px]"
            >
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
              </svg>
              <span>Add New Student</span>
            </button>
          </div>
        </div>
      );
    }

    // Student Directory Component
    function StudentDirectory({
      students,
      searchQuery,
      onSearchChange,
      selectedDepartment,
      onDepartmentChange,
      selectedYear,
      onYearChange,
      onResetFilters,
      onEditStudent,
      onDeleteStudent,
      onOpenAddModal,
      totalStudents
    }) {
      const [sortBy, setSortBy] = useState('name-asc');
      const [viewMode, setViewMode] = useState('auto'); // 'auto', 'table', 'cards'

      // Filter by Name OR Student ID + Dept + Year
      const filteredStudents = students.filter((s) => {
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch =
          !q ||
          s.name.toLowerCase().includes(q) ||
          s.id.toLowerCase().includes(q);

        const matchesDept = !selectedDepartment || s.department === selectedDepartment;
        const matchesYear = !selectedYear || s.academicYear === selectedYear;

        return matchesSearch && matchesDept && matchesYear;
      });

      // Sort
      const sortedStudents = [...filteredStudents].sort((a, b) => {
        switch (sortBy) {
          case 'name-asc':
            return a.name.localeCompare(b.name);
          case 'name-desc':
            return b.name.localeCompare(a.name);
          case 'id-asc':
            return a.id.localeCompare(b.id);
          case 'id-desc':
            return b.id.localeCompare(a.id);
          case 'dept':
            return a.department.localeCompare(b.department);
          case 'year':
            return a.academicYear.localeCompare(b.academicYear);
          default:
            return 0;
        }
      });

      const isFiltered = Boolean(searchQuery || selectedDepartment || selectedYear);

      return (
        <section className="space-y-4">
          {/* Controls Bar */}
          <div className="bg-white rounded-2xl p-4 sm:p-5 border border-purple-100 shadow-sm space-y-4">
            
            {/* Top row: Search input & sort options */}
            <div className="flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
              
              {/* Search Bar */}
              <div className="relative flex-1">
                <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-purple-600">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                </div>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => onSearchChange(e.target.value)}
                  placeholder="Search by student name or student ID (e.g. Aarav, Priya, or CC-2024)..."
                  className="w-full pl-11 pr-10 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 min-h-[44px] transition-colors"
                />
                {searchQuery && (
                  <button
                    onClick={() => onSearchChange('')}
                    className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
                    aria-label="Clear search"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                )}
              </div>

              {/* Sort selector & view buttons */}
              <div className="flex items-center gap-2">
                <div className="flex items-center gap-1.5 flex-1 sm:flex-initial">
                  <label htmlFor="sort-select-main" className="text-xs font-semibold text-slate-500 hidden sm:inline">
                    Sort:
                  </label>
                  <select
                    id="sort-select-main"
                    value={sortBy}
                    onChange={(e) => setSortBy(e.target.value)}
                    className="w-full sm:w-auto px-3 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm font-semibold text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-purple-500 min-h-[44px]"
                  >
                    <option value="name-asc">Name (A → Z)</option>
                    <option value="name-desc">Name (Z → A)</option>
                    <option value="id-asc">Student ID (Asc)</option>
                    <option value="id-desc">Student ID (Desc)</option>
                    <option value="dept">Department</option>
                    <option value="year">Academic Year</option>
                  </select>
                </div>

                {/* View Switcher for Desktop */}
                <div className="hidden md:flex items-center p-1 bg-slate-100 rounded-xl border border-slate-200 min-h-[44px]">
                  <button
                    onClick={() => setViewMode('table')}
                    title="Table View"
                    className={`p-2 rounded-lg text-xs font-bold transition-all ${
                      viewMode === 'table' || viewMode === 'auto'
                        ? 'bg-white text-purple-800 shadow-sm'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                    </svg>
                  </button>
                  <button
                    onClick={() => setViewMode('cards')}
                    title="Cards View"
                    className={`p-2 rounded-lg text-xs font-bold transition-all ${
                      viewMode === 'cards'
                        ? 'bg-white text-purple-800 shadow-sm'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                    </svg>
                  </button>
                </div>
              </div>

            </div>

            {/* Department and Academic Year Filters */}
            <div className="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
              
              {/* Department Filters */}
              <div className="flex flex-wrap items-center gap-1.5">
                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider mr-1">Department:</span>
                <button
                  onClick={() => onDepartmentChange('')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all min-h-[36px] flex items-center ${
                    !selectedDepartment
                      ? 'bg-purple-700 text-white shadow-sm'
                      : 'bg-slate-100 text-slate-600 hover:bg-purple-50 hover:text-purple-700'
                  }`}
                >
                  All
                </button>
                {DEPARTMENTS.map((dept) => {
                  const active = selectedDepartment === dept.code;
                  return (
                    <button
                      key={dept.code}
                      onClick={() => onDepartmentChange(active ? '' : dept.code)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all min-h-[36px] flex items-center gap-1 ${
                        active
                          ? 'bg-purple-700 text-white shadow-sm'
                          : 'bg-slate-100 text-slate-700 hover:bg-purple-50 hover:text-purple-700'
                      }`}
                    >
                      <span>{dept.code}</span>
                      <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${active ? 'bg-purple-800 text-purple-200' : 'bg-slate-200 text-slate-600'}`}>
                        {students.filter((s) => s.department === dept.code).length}
                      </span>
                    </button>
                  );
                })}
              </div>

              {/* Academic Year Filters */}
              <div className="flex flex-wrap items-center gap-1.5">
                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider mr-1">Year:</span>
                <button
                  onClick={() => onYearChange('')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all min-h-[36px] flex items-center ${
                    !selectedYear
                      ? 'bg-purple-700 text-white shadow-sm'
                      : 'bg-slate-100 text-slate-600 hover:bg-purple-50 hover:text-purple-700'
                  }`}
                >
                  All
                </button>
                {ACADEMIC_YEARS.map((yr) => {
                  const active = selectedYear === yr.code;
                  return (
                    <button
                      key={yr.code}
                      onClick={() => onYearChange(active ? '' : yr.code)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all min-h-[36px] flex items-center gap-1 ${
                        active
                          ? 'bg-purple-700 text-white shadow-sm'
                          : 'bg-slate-100 text-slate-700 hover:bg-purple-50 hover:text-purple-700'
                      }`}
                    >
                      <span>{yr.code}</span>
                      <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${active ? 'bg-purple-800 text-purple-200' : 'bg-slate-200 text-slate-600'}`}>
                        {students.filter((s) => s.academicYear === yr.code).length}
                      </span>
                    </button>
                  );
                })}
              </div>

            </div>

            {/* Results counter and active filters reset */}
            <div className="flex items-center justify-between text-xs text-slate-500 pt-2 border-t border-slate-100">
              <div className="flex items-center gap-2 flex-wrap">
                <span>
                  Showing <strong className="text-slate-800">{sortedStudents.length}</strong> of{' '}
                  <strong className="text-slate-800">{totalStudents}</strong> students
                </span>
                {isFiltered && (
                  <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-purple-50 text-purple-700 font-semibold border border-purple-100">
                    Active filters
                  </span>
                )}
              </div>

              {isFiltered && (
                <button
                  onClick={onResetFilters}
                  className="text-xs font-semibold text-purple-700 hover:text-purple-900 underline flex items-center gap-1 focus:outline-none"
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                  <span>Reset filters</span>
                </button>
              )}
            </div>

          </div>

          {/* Student List Display */}
          {sortedStudents.length === 0 ? (
            <EmptyState
              searchQuery={searchQuery}
              selectedDepartment={selectedDepartment}
              selectedYear={selectedYear}
              onResetFilters={onResetFilters}
              onOpenAddModal={onOpenAddModal}
              totalStudents={totalStudents}
            />
          ) : (
            <>
              {/* Mobile View: Cards layout always rendered on small screens to prevent overflow and enable easy tapping */}
              <div className={`grid grid-cols-1 gap-3.5 ${viewMode === 'cards' ? 'sm:grid-cols-2 lg:grid-cols-3' : 'md:hidden'}`}>
                {sortedStudents.map((student) => (
                  <StudentCard
                    key={student.id}
                    student={student}
                    onEdit={onEditStudent}
                    onDelete={onDeleteStudent}
                  />
                ))}
              </div>

              {/* Desktop Table View (>= 768px when viewMode !== 'cards') */}
              <div className={`hidden ${viewMode !== 'cards' ? 'md:block' : ''} bg-white rounded-2xl border border-purple-100 shadow-sm overflow-hidden`}>
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-purple-50/70 border-b border-purple-100 text-[11px] font-bold uppercase tracking-wider text-purple-900">
                        <th scope="col" className="py-3.5 px-6">Student Name</th>
                        <th scope="col" className="py-3.5 px-4">Student ID</th>
                        <th scope="col" className="py-3.5 px-4">Email Address</th>
                        <th scope="col" className="py-3.5 px-4">Department</th>
                        <th scope="col" className="py-3.5 px-4">Academic Year</th>
                        <th scope="col" className="py-3.5 px-6 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-purple-50 text-sm">
                      {sortedStudents.map((student) => (
                        <tr
                          key={student.id}
                          className="hover:bg-purple-50/40 transition-colors group"
                        >
                          <td className="py-4 px-6">
                            <div className="flex items-center gap-3">
                              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-700 to-indigo-600 text-white font-bold text-xs flex items-center justify-center shadow-sm shrink-0">
                                {getInitials(student.name)}
                              </div>
                              <div>
                                <p className="font-bold text-slate-800 group-hover:text-purple-900 transition-colors">
                                  {student.name}
                                </p>
                              </div>
                            </div>
                          </td>

                          <td className="py-4 px-4">
                            <span className="font-mono text-xs font-semibold text-purple-800 bg-purple-50 px-2 py-1 rounded-md border border-purple-100">
                              {student.id}
                            </span>
                          </td>

                          <td className="py-4 px-4">
                            <a
                              href={`mailto:${student.email}`}
                              className="text-xs text-slate-600 hover:text-purple-700 underline-offset-2 hover:underline"
                            >
                              {student.email}
                            </a>
                          </td>

                          <td className="py-4 px-4">
                            <span className={`inline-block px-2.5 py-1 rounded-full text-xs font-bold border ${deptStyles[student.department]?.badge || 'bg-slate-100 text-slate-700'}`}>
                              {student.department}
                            </span>
                          </td>

                          <td className="py-4 px-4">
                            <span className={`inline-block px-2.5 py-1 rounded-full text-xs font-semibold border ${yearStyles[student.academicYear] || 'bg-slate-100 text-slate-700'}`}>
                              {student.academicYear}
                            </span>
                          </td>

                          <td className="py-4 px-6 text-right">
                            <div className="flex items-center justify-end gap-1.5">
                              <button
                                onClick={() => onEditStudent(student)}
                                className="p-2 rounded-lg text-purple-700 hover:text-purple-900 hover:bg-purple-100/70 transition-colors focus:outline-none min-h-[38px] min-w-[38px] flex items-center justify-center"
                                title={`Edit ${student.name}`}
                                aria-label={`Edit ${student.name}`}
                              >
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                </svg>
                              </button>

                              <button
                                onClick={() => onDeleteStudent(student)}
                                className="p-2 rounded-lg text-red-600 hover:text-red-800 hover:bg-red-50 transition-colors focus:outline-none min-h-[38px] min-w-[38px] flex items-center justify-center"
                                title={`Delete ${student.name}`}
                                aria-label={`Delete ${student.name}`}
                              >
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </>
          )}
        </section>
      );
    }

    // Student Add/Edit Modal Component
    function StudentModal({ isOpen, onClose, onSave, studentToEdit, existingStudents }) {
      const isEditing = Boolean(studentToEdit);

      const [formData, setFormData] = useState({
        name: '',
        id: '',
        email: '',
        department: 'AI',
        academicYear: 'FY'
      });

      const [errors, setErrors] = useState({});

      useEffect(() => {
        if (studentToEdit) {
          setFormData({
            name: studentToEdit.name || '',
            id: studentToEdit.id || '',
            email: studentToEdit.email || '',
            department: studentToEdit.department || 'AI',
            academicYear: studentToEdit.academicYear || 'FY'
          });
        } else {
          // Generate sequential suggestion
          const num = String(existingStudents.length + 1).padStart(3, '0');
          setFormData({
            name: '',
            id: `CC-2024-${num}`,
            email: '',
            department: 'AI',
            academicYear: 'FY'
          });
        }
        setErrors({});
      }, [studentToEdit, isOpen, existingStudents]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && isOpen) onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      const validate = () => {
        const newErrors = {};

        if (!formData.name.trim()) {
          newErrors.name = 'Full name is required';
        } else if (formData.name.trim().length < 2) {
          newErrors.name = 'Name must be at least 2 characters';
        }

        if (!formData.id.trim()) {
          newErrors.id = 'Student ID is required';
        } else {
          const cleanId = formData.id.trim().toUpperCase();
          const duplicate = existingStudents.find(
            (s) => s.id.toUpperCase() === cleanId && (!isEditing || s.id !== studentToEdit.id)
          );
          if (duplicate) {
            newErrors.id = 'This Student ID already exists';
          }
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!formData.email.trim()) {
          newErrors.email = 'Email address is required';
        } else if (!emailRegex.test(formData.email.trim())) {
          newErrors.email = 'Please enter a valid email format';
        }

        if (!formData.department) {
          newErrors.department = 'Please select a department';
        }

        if (!formData.academicYear) {
          newErrors.academicYear = 'Please select an academic year';
        }

        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!validate()) return;

        onSave({
          id: formData.id.trim().toUpperCase(),
          name: formData.name.trim(),
          email: formData.email.trim().toLowerCase(),
          department: formData.department,
          academicYear: formData.academicYear
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto animate-fade-in">
          <div 
            className="bg-white rounded-3xl max-w-lg w-full p-5 sm:p-7 shadow-2xl border border-purple-100 my-auto transform transition-all animate-scale-up"
            role="dialog"
            aria-modal="true"
          >
            <div className="flex items-center justify-between pb-4 border-b border-purple-50">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center">
                  {isEditing ? (
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                  ) : (
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                    </svg>
                  )}
                </div>
                <div>
                  <h2 className="text-lg font-bold text-slate-800 tracking-tight">
                    {isEditing ? 'Edit Student Details' : 'Add New Student'}
                  </h2>
                  <p className="text-xs text-slate-500">
                    {isEditing ? 'Update student records in CampusConnect' : 'Enroll a student into the system'}
                  </p>
                </div>
              </div>

              <button
                onClick={onClose}
                className="text-slate-400 hover:text-slate-600 p-2 rounded-xl hover:bg-slate-100 transition-colors focus:outline-none min-h-[44px] min-w-[44px] flex items-center justify-center"
                aria-label="Close dialog"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="mt-5 space-y-4">
              
              {/* Name */}
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                  Full Name <span className="text-purple-600">*</span>
                </label>
                <input
                  type="text"
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  placeholder="e.g. Aarav Sharma"
                  className={`w-full px-4 py-2.5 rounded-xl border text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 min-h-[44px] transition-colors ${
                    errors.name ? 'border-red-300 focus:ring-red-400 bg-red-50/30' : 'border-slate-200 focus:ring-purple-500 focus:border-purple-500'
                  }`}
                />
                {errors.name && <p className="text-xs text-red-600 mt-1">{errors.name}</p>}
              </div>

              {/* ID & Email */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Student ID <span className="text-purple-600">*</span>
                  </label>
                  <input
                    type="text"
                    value={formData.id}
                    onChange={(e) => setFormData({ ...formData, id: e.target.value })}
                    placeholder="CC-2024-001"
                    className={`w-full px-4 py-2.5 rounded-xl border text-sm font-mono text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 min-h-[44px] transition-colors ${
                      errors.id ? 'border-red-300 focus:ring-red-400 bg-red-50/30' : 'border-slate-200 focus:ring-purple-500 focus:border-purple-500'
                    }`}
                  />
                  {errors.id && <p className="text-xs text-red-600 mt-1">{errors.id}</p>}
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Email Address <span className="text-purple-600">*</span>
                  </label>
                  <input
                    type="email"
                    value={formData.email}
                    onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                    placeholder="student@campusconnect.edu"
                    className={`w-full px-4 py-2.5 rounded-xl border text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 min-h-[44px] transition-colors ${
                      errors.email ? 'border-red-300 focus:ring-red-400 bg-red-50/30' : 'border-slate-200 focus:ring-purple-500 focus:border-purple-500'
                    }`}
                  />
                  {errors.email && <p className="text-xs text-red-600 mt-1">{errors.email}</p>}
                </div>
              </div>

              {/* Department & Academic Year */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Department <span className="text-purple-600">*</span>
                  </label>
                  <select
                    value={formData.department}
                    onChange={(e) => setFormData({ ...formData, department: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 min-h-[44px]"
                  >
                    {DEPARTMENTS.map((dept) => (
                      <option key={dept.code} value={dept.code}>
                        {dept.code} - {dept.name}
                      </option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Academic Year <span className="text-purple-600">*</span>
                  </label>
                  <select
                    value={formData.academicYear}
                    onChange={(e) => setFormData({ ...formData, academicYear: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 min-h-[44px]"
                  >
                    {ACADEMIC_YEARS.map((yr) => (
                      <option key={yr.code} value={yr.code}>
                        {yr.code} ({yr.name})
                      </option>
                    ))}
                  </select>
                </div>
              </div>

              {/* Submit / Cancel Buttons */}
              <div className="pt-4 border-t border-purple-50 flex flex-col-reverse sm:flex-row items-center justify-end gap-2.5">
                <button
                  type="button"
                  onClick={onClose}
                  className="w-full sm:w-auto px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-100 font-semibold text-xs sm:text-sm transition-colors min-h-[44px] flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-purple-400"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-gradient-to-r from-purple-700 to-indigo-600 hover:from-purple-800 hover:to-indigo-700 text-white font-bold text-xs sm:text-sm shadow-md shadow-purple-300/50 transition-all min-h-[44px] flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-purple-500"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
                  </svg>
                  <span>{isEditing ? 'Save Changes' : 'Add Student'}</span>
                </button>
              </div>

            </form>
          </div>
        </div>
      );
    }

    // Delete Confirmation Modal Component
    function DeleteConfirmModal({ student, isOpen, onClose, onConfirm }) {
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && isOpen) onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, onClose]);

      if (!isOpen || !student) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div 
            className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-7 shadow-2xl border border-purple-100 transform transition-all animate-scale-up"
            role="dialog"
            aria-modal="true"
          >
            <div className="flex items-start gap-4">
              <div className="w-12 h-12 rounded-2xl bg-red-100 text-red-600 flex items-center justify-center shrink-0">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </div>
              <div>
                <h3 className="text-lg font-bold text-slate-800 tracking-tight">
                  Delete Student Record?
                </h3>
                <p className="text-xs sm:text-sm text-slate-500 mt-1 leading-relaxed">
                  Are you sure you want to permanently delete <span className="font-semibold text-slate-800">{student.name}</span> (<span className="font-mono text-purple-700">{student.id}</span>)? This action cannot be undone.
                </p>
              </div>
            </div>

            <div className="mt-4 p-3.5 rounded-xl bg-purple-50/60 border border-purple-100 text-xs text-slate-600 flex items-center justify-between">
              <div>
                <p className="font-bold text-purple-900">{student.name}</p>
                <p className="text-slate-500 text-[11px] font-mono mt-0.5">{student.email}</p>
              </div>
              <div className="flex gap-1.5">
                <span className="px-2 py-0.5 rounded-md bg-purple-200 text-purple-800 font-bold text-[10px]">
                  {student.department}
                </span>
                <span className="px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-700 font-bold text-[10px]">
                  {student.academicYear}
                </span>
              </div>
            </div>

            <div className="mt-6 flex flex-col-reverse sm:flex-row items-center justify-end gap-2.5">
              <button
                type="button"
                onClick={onClose}
                className="w-full sm:w-auto px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-100 font-semibold text-xs sm:text-sm transition-colors min-h-[44px] flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-purple-400"
              >
                Cancel
              </button>
              <button
                type="button"
                onClick={() => onConfirm(student.id)}
                className="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-xs sm:text-sm shadow-md shadow-red-200 transition-all min-h-[44px] flex items-center justify-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-red-400"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7" />
                </svg>
                <span>Confirm Delete</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      // Load initial students from localStorage or fallback
      const [students, setStudents] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed;
            }
          }
        } catch (e) {
          console.error('Error loading localStorage:', e);
        }
        return INITIAL_STUDENTS;
      });

      // Synchronize with localStorage
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
        } catch (e) {
          console.error('Error writing to localStorage:', e);
        }
      }, [students]);

      // State for filtering & searching
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedDepartment, setSelectedDepartment] = useState('');
      const [selectedYear, setSelectedYear] = useState('');

      // State for modals
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [studentToEdit, setStudentToEdit] = useState(null);
      const [studentToDelete, setStudentToDelete] = useState(null);

      // Toast notification state
      const [toast, setToast] = useState(null);

      const showToast = (title, message, type = 'success') => {
        setToast({ title, message, type });
      };

      // Modal Handlers
      const handleOpenAddModal = () => {
        setStudentToEdit(null);
        setIsModalOpen(true);
      };

      const handleOpenEditModal = (student) => {
        setStudentToEdit(student);
        setIsModalOpen(true);
      };

      const handleCloseModal = () => {
        setIsModalOpen(false);
        setStudentToEdit(null);
      };

      const handleSaveStudent = (data) => {
        if (studentToEdit) {
          // Edit
          setStudents((prev) =>
            prev.map((s) => (s.id === studentToEdit.id ? { ...s, ...data } : s))
          );
          showToast(
            'Student Updated',
            `Successfully updated details for ${data.name} (${data.id}).`,
            'success'
          );
        } else {
          // Add
          const newStudent = {
            ...data,
            createdAt: new Date().toISOString()
          };
          setStudents((prev) => [newStudent, ...prev]);
          showToast(
            'Student Added',
            `Successfully enrolled ${data.name} (${data.id}) in ${data.department}.`,
            'success'
          );
        }
        handleCloseModal();
      };

      // Delete Handlers
      const handleOpenDeleteModal = (student) => {
        setStudentToDelete(student);
      };

      const handleCloseDeleteModal = () => {
        setStudentToDelete(null);
      };

      const handleConfirmDelete = (id) => {
        const student = students.find((s) => s.id === id);
        setStudents((prev) => prev.filter((s) => s.id !== id));
        showToast(
          'Student Removed',
          `Record for ${student ? student.name : id} was deleted from CampusConnect.`,
          'info'
        );
        handleCloseDeleteModal();
      };

      // Reset to 10 sample Indian students
      const handleResetData = () => {
        if (window.confirm('Reset student records to the 10 initial sample Indian college students?')) {
          setStudents(INITIAL_STUDENTS);
          setSearchQuery('');
          setSelectedDepartment('');
          setSelectedYear('');
          showToast(
            'Data Reset',
            'CampusConnect restored to the 10 initial college students.',
            'info'
          );
        }
      };

      const handleResetFilters = () => {
        setSearchQuery('');
        setSelectedDepartment('');
        setSelectedYear('');
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans">
          
          {/* Header */}
          <Navbar
            onOpenAddModal={handleOpenAddModal}
            onResetData={handleResetData}
            totalCount={students.length}
          />

          {/* Main Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-8">
            
            {/* Dashboard Statistics */}
            <Dashboard
              students={students}
              selectedDepartment={selectedDepartment}
              onSelectDepartment={setSelectedDepartment}
              selectedYear={selectedYear}
              onSelectYear={setSelectedYear}
            />

            {/* Student Directory with Search, Filters & Action Table/Cards */}
            <StudentDirectory
              students={students}
              searchQuery={searchQuery}
              onSearchChange={setSearchQuery}
              selectedDepartment={selectedDepartment}
              onDepartmentChange={setSelectedDepartment}
              selectedYear={selectedYear}
              onYearChange={setSelectedYear}
              onResetFilters={handleResetFilters}
              onEditStudent={handleOpenEditModal}
              onDeleteStudent={handleOpenDeleteModal}
              onOpenAddModal={handleOpenAddModal}
              totalStudents={students.length}
            />

          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-purple-100 py-6 sm:py-8 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 space-y-2">
              <div className="flex items-center justify-center gap-2">
                <span className="w-2 h-2 rounded-full bg-purple-600"></span>
                <span className="font-bold text-slate-700">CampusConnect Student Management System</span>
              </div>
              <p>© 2026 CampusConnect • Persistent LocalStorage • AI, DS, CS, IT Departments • FY, SY, TY Academic Years</p>
            </div>
          </footer>

          {/* Floating Action Button for Mobile Screens */}
          <div className="sm:hidden fixed bottom-6 right-6 z-40">
            <button
              onClick={handleOpenAddModal}
              className="w-14 h-14 rounded-full bg-gradient-to-r from-purple-700 to-indigo-600 text-white shadow-xl shadow-purple-500/50 flex items-center justify-center focus:outline-none focus:ring-4 focus:ring-purple-300 active:scale-95 transition-all"
              aria-label="Add Student"
            >
              <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4" />
              </svg>
            </button>
          </div>

          {/* Add / Edit Student Modal */}
          <StudentModal
            isOpen={isModalOpen}
            onClose={handleCloseModal}
            onSave={handleSaveStudent}
            studentToEdit={studentToEdit}
            existingStudents={students}
          />

          {/* Delete Confirmation Modal */}
          <DeleteConfirmModal
            isOpen={Boolean(studentToDelete)}
            student={studentToDelete}
            onClose={handleCloseDeleteModal}
            onConfirm={handleConfirmDelete}
          />

          {/* Toast Notification Alert */}
          <Toast toast={toast} onClose={() => setToast(null)} />

        </div>
      );
    }

    // Render root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
